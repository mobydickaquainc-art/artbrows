const STYLE_NAME = {cream:'크림 살구',dark:'Luxury Dark',kbeauty:'K-Beauty',editorial:'Editorial',hand:'손글씨',y2k:'Y2K Pop'};
const STYLE_KEYS = Object.keys(STYLE_NAME);
const VARIANT_KEYS = ['default','slight','new','trendy','ai'];
const IMG_KEYS = ['studio','ai','mix'];
const ROLE_NAMES = ['표지','공감','답','차별','혜택','CTA'];

let autoStep = 0;
let autoChoices = []; // 각 장의 [style, variant, img]
const pick = a => a[Math.floor(Math.random()*a.length)];

function autoGenerate(){
  // 한 세트 추천 (스타일은 6장 동일 유지 = 캐러셀 일관성)
  const s = pick(STYLE_KEYS), v = pick(VARIANT_KEYS), m = pick(IMG_KEYS);
  applyChoice(s, v, m);
  autoStep = 0;
  autoChoices = Array(6).fill([s, v, m]);
  openAutoModal();
  startStep(0);
}

function applyChoice(s, v, m){
  document.body.dataset.style = s;
  document.querySelectorAll('#styleChips .chip-btn').forEach(b=>b.classList.toggle('sel', b.dataset.s===s));
  document.getElementById('curStyle').textContent = STYLE_NAME[s];
  curVariant = v;
  document.getElementById('vName').textContent = VARIANT_NAMES[v];
  document.getElementById('curVariant').textContent = VARIANT_NAMES[v];
  curImg = m;
  document.getElementById('imgName').textContent = IMG_MODES[m].name;
  render();
}

function closeAutoModal(){
  const m = document.getElementById('autoModal');
  if(m) m.remove();
  autoStep = 0;
}

function startStep(i){
  autoStep = i;
  const s = autoChoices[i][0], v = autoChoices[i][1], m = autoChoices[i][2];
  document.getElementById('autoStepTxt').textContent = `장 ${i+1}/6 · ${ROLE_NAMES[i]}`;
  document.getElementById('autoStatTxt').textContent = '제작 중...';
  document.getElementById('autoBar').style.width = `${(i/6)*100}%`;

  `;
  document.getElementById('autoActions').innerHTML = '';

function renderStepList(cur){
  document.getElementById('autoStepList').innerHTML = ROLE_NAMES.map((r,i)=>{
    const bg = i<cur ? '#A8E6B3' : (i===cur ? '#FFB78A' : '#F0D6CC');
    const ic = i<cur ? '✓' : (i===cur ? '•' : '·');
    const c  = i<cur ? '#3D2818' : (i===cur ? '#3D2818' : '#A89A88');
    return `<span style="background:${bg};color:${c};padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700">${ic} ${r}</span>`;
  }).join('');
}

}

function continueStep(){
  if(autoStep < 5) startStep(autoStep + 1);
}
function redoStep(){
  // 같은 장만 다른 옵션으로 재시도
  const s = pick(STYLE_KEYS.filter(x=>x!==autoChoices[autoStep][0])); // 다른 스타일
  const v = pick(VARIANT_KEYS);
  applyChoice(s, v, autoChoices[autoStep][2]);
  autoChoices = autoChoices.map((c,i)=>i>=autoStep ? [s,v,c[2]] : c);
  document.getElementById('autoCurStyle').textContent = STYLE_NAME[s];
  document.getElementById('autoCurCopy').textContent = VARIANT_NAMES[v];
  startStep(autoStep);
}

          </div>
          <button onclick="document.getElementById('recModal').remove()" style="background:transparent;border:none;font-size:24px;color:#8B6452;cursor:pointer">×</button>
        </div>
        <div id="recBody" style="padding:30px 24px;text-align:center;min-height:220px">
          <div style="font-size:36px;margin-bottom:14px">🔮</div>
          <div style="font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:16px;color:#3D2818;margin-bottom:8px">2026-06 트렌드 분석 중...</div>
          <div style="font-size:11.5px;color:#8B6452;line-height:1.7">
            · 인스타 #극사실아트눈썹 · 1.2K 게시물 스캔<br>
            · 중국 小红书 #超写实艺术眉 · 트렌드 컬러 추출<br>
            · Vogue / Allure / Cosmopolitan 2026 봄·여름 트렌드

      </div>
    </div>
  `;
  document.body.appendChild(m);
  setTimeout(showRecommendation, 1500);
}

function showRecommendation(){
  const idx = Math.floor(Math.random()*recPool.length);
  const t = recPool.splice(idx, 1)[0];
  document.getElementById('recBody').innerHTML = `
    <div style="text-align:left;padding:0 6px">
      <div style="font-size:10.5px;color:#7FB3FF;font-weight:700;letter-spacing:2px;margin-bottom:4px">TREND DETECTED · 추천</div>
      <div style="font-family:'Nanum Myeongjo',serif;font-weight:900;font-size:24px;color:#3D2818;margin-bottom:6px">${t.name}</div>
      <span style="display:inline-block;background:#FFE5D0;color:#3D2818;font-size:11px;font-weight:700;padding:4px 10px;border-radius:10px;margin-bottom:12px">${t.tag}</span>
      <p style="font-size:13.5px;color:#5D4636;line-height:1.7;margin-bottom:16px">${t.desc}</p>
      <!-- 미리보기 -->
      <div style="background:${t.bg};color:${t.col};border-radius:12px;padding:24px 20px;text-align:center;font-family:${t.font};margin-bottom:6px">
        <div style="font-size:10px;letter-spacing:2px;opacity:0.7;margin-bottom:6px">@artbrows_academy</div>
        <div style="font-weight:900;font-size:24px;line-height:1.25;margin-bottom:8px">14기 이지클래스<br><span style="color:${t.acc}">모집 시작</span></div>
        <div style="font-size:12px;margin-bottom:10px">장미지 원장 직강 · 9월 1일 OPEN</div>
        <div style="display:inline-block;background:${t.acc};color:#fff;font-size:11px;font-weight:700;padding:7px 16px;border-radius:8px">카카오 채널로 신청</div>
        <div style="margin-top:14px;font-weight:800;font-size:15px;color:${t.brand}">ARTbrows</div>
      </div>
      <p style="font-size:10.5px;color:#A89A88;text-align:center">↑ 표지 1장 미리보기 · 6장 모두 이 톤으로 적용 가능</p>
    </div>
  `;
  document.getElementById('recActions').innerHTML = `
    <button onclick="recommendNewStyle();" style="padding:9px 16px;background:#fff;border:1.5px solid #FAD7C7;color:#5D4636;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer">↻ 다른 스타일</button>
    <button onclick="applyNewStyle('${t.key}',${JSON.stringify(t).replace(/"/g,'&quot;')})" style="padding:9px 22px;background:linear-gradient(135deg,#A8E6B3,#7FB3FF);color:#3D2818;border:none;border-radius:8px;font-weight:800;font-size:13.5px;cursor:pointer">✓ 적용해보기</button>
  `;
  // 액션 버튼에서 JSON 인코딩 문제 회피 — window에 임시 저장
  window._lastRec = t;
  document.getElementById('recActions').querySelector('button:last-child').onclick = function(){ applyNewStyle(t.key, t); };
}

function applyNewStyle(key, t){
  // 동적으로 CSS 추가
  if(!document.getElementById('dyn-style-'+key)){
    const st = document.createElement('style');
    st.id = 'dyn-style-'+key;
    st.textContent = `
      body[data-style="${key}"] .slide-preview{background:${t.bg};color:${t.col};font-family:${t.font}}
      body[data-style="${key}"] .slide-headline{color:${t.col}}
      body[data-style="${key}"] .slide-headline em{color:${t.acc};font-style:normal}
      body[data-style="${key}"] .slide-cta{background:${t.acc};color:#fff}
      body[data-style="${key}"] .slide-brand{color:${t.brand};font-family:${t.font}}
      body[data-style="${key}"] .slide-body{color:${t.col};opacity:0.85}
    `;
    document.head.appendChild(st);
  }
  // 동적으로 스타일 칩 추가 (이미 있으면 skip)
  const chips = document.getElementById('styleChips');
  if(!chips.querySelector(`[data-s="${key}"]`)){
    const btn = document.createElement('button');
    btn.className = 'chip-btn';
    btn.dataset.s = key;
    btn.style.background = 'linear-gradient(135deg,#A8E6B3,#7FB3FF)';
    btn.style.color = '#3D2818';
    btn.style.borderColor = '#7FB3FF';
    btn.innerHTML = `🔮 ${t.name}`;
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#styleChips .chip-btn').forEach(x=>x.classList.remove('sel'));
      btn.classList.add('sel');
      document.body.dataset.style = key;
      document.getElementById('curStyle').textContent = t.name;
    });
    chips.appendChild(btn);
  }
  // STYLE_NAME에도 등록 (자동 생성 풀에 포함)
  STYLE_NAME[key] = t.name;
  if(!STYLE_KEYS.includes(key)) STYLE_KEYS.push(key);

  // 즉시 적용
  document.querySelectorAll('#styleChips .chip-btn').forEach(x=>x.classList.remove('sel'));
  chips.querySelector(`[data-s="${key}"]`).classList.add('sel');
  document.body.dataset.style = key;
  document.getElementById('curStyle').textContent = t.name;

  // 모달 닫고 토스트
  document.getElementById('recModal').remove();
  const toast = document.createElement('div');
  toast.innerHTML = `🔮 <b>${t.name}</b> 스타일 추가됨 · 상단 칩에서 언제든 선택 가능`;
  toast.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#7FB3FF;color:#fff;padding:12px 22px;border-radius:24px;font-weight:700;font-size:13px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,0.3)';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 3000);
}

function finishAuto(){
  closeAutoModal();
  const toast = document.createElement('div');
  toast.innerHTML = `✨ 6장 완성! <span style="opacity:0.8">📸 PNG 저장 또는 📤 인스타 게시 가능</span>`;
  toast.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#A8E6B3;color:#3D2818;padding:12px 22px;border-radius:24px;font-weight:700;font-size:13px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,0.3)';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 3000);
}

function cycleImageSrc(){
  const order = ['studio','ai','mix','text'];
  const i = order.indexOf(curImg);
  curImg = order[(i+1) % order.length];
  document.getElementById('imgName').textContent = IMG_MODES[curImg].name;
  render();
}

function cycleVariant(){
  const order = ['default','slight','new','trendy','ai'];
  const i = order.indexOf(curVariant);
  curVariant = order[(i+1) % order.length];
  document.getElementById('vName').textContent = VARIANT_NAMES[curVariant];
  document.getElementById('curVariant').textContent = VARIANT_NAMES[curVariant];
  render();
}

// 스타일 변경
document.querySelectorAll('#styleChips .chip-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#styleChips .chip-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    const s=b.dataset.s;
    document.body.dataset.style=s;
    document.getElementById('curStyle').textContent=b.textContent;
  });
});

render();
</script>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>개발 일지 — 장미지 연구소 · ARTbrows Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800;900&family=Pretendard:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',sans-serif;background:#0B0907;color:#F5EDE3;line-height:1.65;font-size:14px;min-height:100vh}

  .top{position:sticky;top:0;background:rgba(11,9,7,0.95);backdrop-filter:blur(20px);border-bottom:1px solid #2A2A2A;padding:12px 28px;display:flex;align-items:center;gap:14px;z-index:100}
  .top a{color:#E0C088;text-decoration:none;font-weight:700;font-size:13px}
  .top .crumb{color:#5A5A56;font-size:12px}
  .top .now{color:#E0C088;font-weight:700;font-size:12px}

  .hero{padding:50px 28px 30px;text-align:center;background:radial-gradient(ellipse at top,rgba(224,192,136,0.06),transparent 70%)}
  .chip{display:inline-block;background:#161617;color:#E0C088;font-weight:700;font-size:10.5px;letter-spacing:4px;padding:7px 18px;border-radius:24px;margin-bottom:14px;border:1px solid #2A2A2A}
  h1{font-family:'Nanum Myeongjo',serif;font-weight:900;font-size:40px;line-height:1.18}
  h1 em{font-style:normal;color:#E0C088}
  .lead{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:19px;color:#CBC8C1;margin-top:10px}

  .stats{max-width:1100px;margin:24px auto 0;padding:0 28px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
  .stat{background:#161617;border:1px solid #2A2A2A;border-top:4px solid var(--c);border-radius:12px;padding:16px;text-align:center}
  .stat.s1{--c:#FFB78A}
  .stat.s2{--c:#E0C088}
  .stat.s3{--c:#A8E6B3}
  .stat.s4{--c:#7FB3FF}
  .stat .v{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--c);line-height:1}
  .stat .l{font-size:10px;color:#8A8A84;margin-top:5px;letter-spacing:2px;font-weight:700}

  .container{max-width:920px;margin:36px auto 60px;padding:0 28px}

  /* 타임라인 */
  .timeline{position:relative;padding-left:36px}
  .timeline::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#E0C088,#2A2A2A)}

  .entry{position:relative;margin-bottom:24px;background:#161617;border:1px solid #2A2A2A;border-radius:14px;padding:20px 22px;transition:all 0.2s}
  .entry:hover{border-color:#E0C088;transform:translateX(2px)}
  .entry::before{content:'';position:absolute;left:-31px;top:24px;width:14px;height:14px;border-radius:50%;background:var(--dot,#E0C088);border:3px solid #0B0907;box-shadow:0 0 0 2px var(--dot,#E0C088)}
  .entry.major{--dot:#FF4D7E}
  .entry.feat{--dot:#E0C088}
  .entry.fix{--dot:#A8E6B3}
  .entry.deploy{--dot:#7FB3FF}

  .entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .entry-date{font-family:'Cormorant Garamond',serif;font-size:14px;color:#E0C088;font-weight:700;letter-spacing:1px}
  .entry-time{font-size:11px;color:#8A8A84;margin-left:4px}
  .entry-tags{display:flex;gap:5px;flex-wrap:wrap}
  .entry-tag{font-size:9.5px;background:rgba(224,192,136,0.1);color:#E0C088;padding:3px 8px;border-radius:6px;font-weight:700;letter-spacing:1px}
  .entry-tag.major{background:rgba(255,77,126,0.15);color:#FF4D7E}
  .entry-tag.feat{background:rgba(224,192,136,0.15);color:#E0C088}
  .entry-tag.fix{background:rgba(168,230,179,0.15);color:#A8E6B3}
  .entry-tag.deploy{background:rgba(127,179,255,0.15);color:#7FB3FF}

  .entry h3{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:17px;color:#F5EDE3;margin-bottom:8px;line-height:1.35}
  .entry h3 em{color:#E0C088;font-style:normal}

  .entry .desc{font-size:13px;color:#CBC8C1;line-height:1.7;margin-bottom:12px}

  .entry .items{list-style:none;margin:10px 0;padding:0}
  .entry .items li{font-size:12.5px;color:#CBC8C1;padding:5px 0 5px 18px;position:relative;line-height:1.55}
  .entry .items li::before{content:'▸';position:absolute;left:0;color:#E0C088;font-weight:700}
  .entry .items li b{color:#F5EDE3}

  .entry .links{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .entry .link{font-size:11.5px;color:#E0C088;background:rgba(224,192,136,0.08);padding:5px 11px;border-radius:6px;text-decoration:none;border:1px solid rgba(224,192,136,0.2);font-weight:700;letter-spacing:0.5px}
  .entry .link:hover{background:rgba(224,192,136,0.15);border-color:#E0C088}

  /* 결정 대기 박스 */
  .pending{background:rgba(255,77,126,0.05);border:1px dashed #FF4D7E;border-radius:8px;padding:12px 14px;margin-top:10px}
  .pending .ptitle{font-size:10px;color:#FF4D7E;font-weight:800;letter-spacing:2px;margin-bottom:6px}
  .pending ul{list-style:none;padding:0}
  .pending li{font-size:12px;color:#CBC8C1;padding:3px 0 3px 16px;position:relative}
  .pending li::before{content:'?';position:absolute;left:0;color:#FF4D7E;font-weight:700}

  footer{margin-top:50px;padding:24px;background:#080706;color:#8A8A84;text-align:center;font-size:11px;border-top:1px solid #2A2A2A}
</style>
</head>

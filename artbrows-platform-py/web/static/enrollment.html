function getSlide(i){
  const base = SLIDES[curVariant][i];

}

}

// === 이미지 업로드 (POST /api/enrollment/upload) ===
async function handleImageUpload(event, idx){
  const file = event.target.files[0];
  if(!file) return;
  const status = document.getElementById('edit-img-status');
  status.textContent = `⏳ 업로드 중 · ${file.name} (${(file.size/1024).toFixed(1)}KB)`;
  status.style.color = '#FFB78A';

  const fd = new FormData();
  fd.append('files', file);
  fd.append('course', '이지');
  fd.append('role', '표지');
  fd.append('memo', `enrollment slide ${idx+1} · ${(new Date()).toISOString().slice(0,10)}`);

  try {
    const r = await fetch('/api/enrollment/upload', { method:'POST', body: fd });
    if(!r.ok){
      const err = await r.text();
      status.textContent = `❌ 업로드 실패: ${r.status} · ${err.slice(0,80)}`;
      status.style.color = '#FF4D7E';
      return;
    }
    const data = await r.json();
    if(!data.ok || !data.items || !data.items[0]){
      status.textContent = `❌ 응답 이상: ${JSON.stringify(data).slice(0,120)}`;
      status.style.color = '#FF4D7E';
      return;
    }
    const url = data.items[0].url;
    document.getElementById('edit-imgurl').value = url;
    document.getElementById('edit-img-preview').innerHTML =
      `<img src="${escHtml(url)}" style="width:100%;height:100%;object-fit:cover;display:block" alt="새 이미지">`;
    status.textContent = `✅ 업로드 완료 · 저장 눌러야 카드 반영`;
    status.style.color = '#5BAE8A';
  } catch(e) {
    status.textContent = `❌ 네트워크 오류: ${e.message}`;
    status.style.color = '#FF4D7E';
  }
}

function clearSlideImage(){
  document.getElementById('edit-imgurl').value = '';
  document.getElementById('edit-img-preview').innerHTML =

// === 라이브러리 피커 (GET /api/enrollment/library) ===
async function openLibraryPicker(idx){
  const status = document.getElementById('edit-img-status');
  status.textContent = '⏳ 라이브러리 불러오는 중...';
  status.style.color = '#FFB78A';
  try {
    const r = await fetch('/api/enrollment/library?limit=60');
    const data = await r.json();
    if(!data.items || !data.items.length){
      status.textContent = '📭 라이브러리 비어있음 · 파일 업로드부터';
      status.style.color = '#8B6452';
      return;
    }
    _renderLibraryPicker(data.items);
    status.textContent = `📚 ${data.items.length}개 로드 · 사진 클릭하면 선택`;
    status.style.color = '#5BAE8A';
  } catch(e) {
    status.textContent = `❌ 로드 실패: ${e.message}`;
    status.style.color = '#FF4D7E';
  }
}

  const existing = document.getElementById('libPickerModal');

  const modal = document.createElement('div');
  modal.id = 'libPickerModal';
  modal.innerHTML = `
    <div style="position:fixed;inset:0;background:rgba(11,9,7,0.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)this.remove()">

        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">
          ${items.map(it => `
            <div onclick="pickFromLibrary('${escHtml(it.url)}')" style="cursor:pointer;border:2px solid #F0D6CC;border-radius:8px;overflow:hidden;transition:border-color 0.15s" onmouseover="this.style.borderColor='#FF4D7E'" onmouseout="this.style.borderColor='#F0D6CC'">
              <div style="width:100%;aspect-ratio:1;background:#FAF6F0;overflow:hidden">
                <img src="${escHtml(it.url)}" style="width:100%;height:100%;object-fit:cover;display:block" loading="lazy" alt="">
              </div>

                ${escHtml(it.role || '-')} · ${escHtml(it.source || 'upload')}<br>
                <span style="opacity:0.6">${escHtml(it.original_name || it.filename).slice(0,20)}</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

  document.body.appendChild(modal);

// === PNG 다운로드 (개별 + zip 6장) ===

async function _capturePreview(idx){
  const el = document.querySelectorAll('.slide-preview')[idx];
  if(!el) throw new Error(`slide ${idx} not found`);
  return await html2canvas(el, {
    scale: 2,
    backgroundColor: null,
    logging: false,
    useCORS: true,
  });
}

async function downloadSlidePNG(idx){
  try {
    showToast(`📸 장 ${idx+1} 캡처 중...`, '#FFB78A');
    const canvas = await _capturePreview(idx);
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `enrollment-slide-${String(idx+1).padStart(2,'0')}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      showToast(`✓ 장 ${idx+1} 다운로드`, '#A8E6B3');
    }, 'image/png');
  } catch(e) {
    showToast(`❌ 캡처 실패: ${e.message}`, '#FFAAAA');
  }
}

async function downloadAllPngZip(){
  const previews = document.querySelectorAll('.slide-preview');
  if(previews.length !== 6){ showToast('❌ 슬라이드 6장 확인 필요', '#FFAAAA'); return; }
  try {
    showToast('📸 6장 캡처 중... (약 5초)', '#FFB78A');
    const zip = new JSZip();
    for(let i=0; i<6; i++){
      const canvas = await _capturePreview(i);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const arrayBuf = await blob.arrayBuffer();
      zip.file(`enrollment-slide-${String(i+1).padStart(2,'0')}.png`, arrayBuf);
    }
    const zipBlob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0,10).replace(/-/g,'');
    a.href = url;
    a.download = `artbrows-enrollment-6-${ts}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast('✓ 6장 zip 다운로드 완료', '#A8E6B3');
  } catch(e) {
    showToast(`❌ zip 실패: ${e.message}`, '#FFAAAA');
  }
}

function applyNewStyle(key, t){
  // 동적으로 CSS 추가
  if(!document.getElementById('dyn-style-'+key)){
    const st = document.createElement('style');
    st.id = 'dyn-style-'+key;
    st.textContent = `
      body[data-style="${key}"] .slide-preview{background:${t.bg};color:${t.col};font-family:${t.font}}
      body[data-style="${key}"] .slide-headline{color:${t.col}}
      body[data-style="${key}"] .slide-headline em{color:${t.acc};font-style:normal}
      body[data-style="${key}"] .slide-cta{background:${t.acc};color:#fff}
      body[data-style="${key}"] .slide-brand{color:${t.brand}}
      body[data-style="${key}"] .slide-body{color:${t.col};opacity:0.85}
    `;
    document.head.appendChild(st);
  }
  // 동적으로 스타일 칩 추가 (이미 있으면 skip)
  const chips = document.getElementById('styleChips');
  if(!chips.querySelector(`[data-s="${key}"]`)){
    const btn = document.createElement('button');
    btn.className = 'chip-btn';
    btn.dataset.s = key;
    btn.style.background = 'linear-gradient(135deg,#A8E6B3,#7FB3FF)';
    btn.style.color = '#3D2818';
    btn.style.borderColor = '#7FB3FF';
    btn.innerHTML = `🔮 ${t.name}`;
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#styleChips .chip-btn').forEach(x=>x.classList.remove('sel'));
      btn.classList.add('sel');
      document.body.dataset.style = key;
      document.getElementById('curStyle').textContent = t.name;
    });
    chips.appendChild(btn);
  }
  // STYLE_NAME에도 등록 (자동 생성 풀에 포함)
  STYLE_NAME[key] = t.name;
  if(!STYLE_KEYS.includes(key)) STYLE_KEYS.push(key);

  // 즉시 적용
  document.querySelectorAll('#styleChips .chip-btn').forEach(x=>x.classList.remove('sel'));
  chips.querySelector(`[data-s="${key}"]`).classList.add('sel');
  document.body.dataset.style = key;
  document.getElementById('curStyle').textContent = t.name;

  // 모달 닫고 토스트
  document.getElementById('recModal').remove();
  const toast = document.createElement('div');
  toast.innerHTML = `🔮 <b>${t.name}</b> 스타일 추가됨 · 상단 칩에서 언제든 선택 가능`;
  toast.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#7FB3FF;color:#fff;padding:12px 22px;border-radius:24px;font-weight:700;font-size:13px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,0.3)';
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 3000);
}

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #F0D6CC">${footerHTML}</div>
  </div>`;
  document.body.appendChild(m);
  return m;
}

// ─── 업로드 모달 ───
function openUploadModal(){
  const body = `
    <div style="display:flex;flex-direction:column;gap:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#8B6452;font-weight:700">강의</span>${_tagSelect('u_course', COURSE_OPTS, '공통')}</label>
        <label style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#8B6452;font-weight:700">시술 부위</span>${_tagSelect('u_body_part', BODY_PART_OPTS)}</label>
        <label style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#8B6452;font-weight:700">톤</span>${_tagSelect('u_tone', TONE_OPTS)}</label>
        <label style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#8B6452;font-weight:700">슬라이드 용도</span>${_tagSelect('u_role', ROLE_OPTS)}</label>
      </div>
      <div id="dropZone" style="border:2.5px dashed #E8B872;border-radius:12px;padding:32px;text-align:center;background:#FFF9F0;cursor:pointer" onclick="document.getElementById('u_files').click()">
        <div style="font-size:48px">📁</div>
        <div style="font-size:15px;color:#5D4636;font-weight:700;margin-top:8px">파일을 드래그하거나 클릭</div>
        <div style="font-size:12px;color:#8B6452;margin-top:4px">여러 장 동시 업로드 · 최대 15MB/장 · PNG·JPG·WEBP</div>
        <input type="file" id="u_files" multiple accept="image/png,image/jpeg,image/webp,image/gif" style="display:none">
        <div id="u_preview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center"></div>
      </div>
      <div id="u_status" style="font-size:13px;color:#8B6452;text-align:center;min-height:18px"></div>
    </div>`;
  const footer = `
    <button onclick="document.getElementById('uploadModal').remove()" style="padding:10px 18px;background:#fff;border:1.5px solid #F0D6CC;color:#5D4636;border-radius:8px;font-weight:700;cursor:pointer">취소</button>
    <button onclick="doUpload()" style="padding:10px 24px;background:linear-gradient(135deg,#7FB37F,#5C9C5C);color:#fff;border:none;border-radius:8px;font-weight:900;cursor:pointer">📤 업로드</button>`;
  const m = _modalShell('uploadModal', '📤 이미지 업로드', body, footer);
  const inp = m.querySelector('#u_files');
  const zone = m.querySelector('#dropZone');
  const prev = m.querySelector('#u_preview');
  const showPreview = files => {
    prev.innerHTML = '';
    [...files].slice(0,12).forEach(f=>{
      const url = URL.createObjectURL(f);
      prev.innerHTML += `<img src="${url}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1.5px solid #F0D6CC">`;
    });
  };
  inp.onchange = () => showPreview(inp.files);
  zone.ondragover = e => { e.preventDefault(); zone.style.background='#FFE8D0'; };
  zone.ondragleave = () => zone.style.background='#FFF9F0';
  zone.ondrop = e => {
    e.preventDefault(); zone.style.background='#FFF9F0';
    const dt = new DataTransfer();
    [...e.dataTransfer.files].forEach(f => dt.items.add(f));
    inp.files = dt.files;
    showPreview(inp.files);
  };
}

async function doUpload(){
  const inp = document.getElementById('u_files');
  const status = document.getElementById('u_status');
  if(!inp.files.length){ status.textContent = '❌ 파일을 선택해주세요'; status.style.color='#c00'; return; }
  const fd = new FormData();
  [...inp.files].forEach(f => fd.append('files', f));
  ['course','body_part','tone','role'].forEach(k => fd.append(k, document.getElementById('u_'+k).value));
  status.textContent = `⏳ 업로드 중… (${inp.files.length}장)`;
  status.style.color = '#8B6452';
  try {
    const r = await fetch(`${ENROLL_API}/upload`, { method:'POST', body: fd });
    const d = await r.json();
    if(!r.ok || !d.ok){ throw new Error(d.detail || 'unknown'); }
    status.textContent = `✅ ${d.count}장 업로드 완료`;
    status.style.color = '#5C9C5C';
    refreshLibCount();
    setTimeout(()=>document.getElementById('uploadModal').remove(), 1200);
  } catch(e){
    status.textContent = '❌ 업로드 실패: ' + e.message;
    status.style.color = '#c00';
  }
}

// ─── 라이브러리 모달 ───
async function openLibraryModal(){
  const body = `
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span style="font-size:12px;color:#8B6452;font-weight:700">필터:</span>
        ${_tagSelect('f_course', COURSE_OPTS)}
        ${_tagSelect('f_role', ROLE_OPTS)}
        <select id="f_source" style="padding:8px 12px;border:1.5px solid #F0D6CC;border-radius:8px;background:#fff;color:#3D2818;font-size:13px">
          <option value="">전체 소스</option>
          <option value="upload">📤 업로드</option>
          <option value="ai">✨ AI 생성</option>
          <option value="master">🎨 마스터</option>
        </select>
        <button onclick="loadLibrary()" style="padding:8px 16px;background:#FF4D7E;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12.5px">🔍 조회</button>
      </div>
      <div id="libGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:52vh;overflow-y:auto;padding:4px">
        <div style="grid-column:1/-1;text-align:center;color:#8B6452;padding:40px 0">불러오는 중…</div>
      </div>
      <div id="libStatus" style="font-size:12px;color:#8B6452;text-align:center"></div>
    </div>`;
  const footer = `<button onclick="document.getElementById('libraryModal').remove()" style="padding:10px 24px;background:#FF4D7E;color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer">닫기</button>`;
  _modalShell('libraryModal', '📁 이미지 라이브러리', body, footer);
  loadLibrary();
}

async function loadLibrary(){
  const grid = document.getElementById('libGrid');
  const status = document.getElementById('libStatus');
  const qs = new URLSearchParams();
  ['course','role','source'].forEach(k => {
    const v = document.getElementById('f_'+k).value;
    if(v) qs.append(k, v);
  });
  qs.append('limit','60');
  try {
    const r = await fetch(`${ENROLL_API}/library?${qs}`);
    const d = await r.json();
    if(!d.items?.length){
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#8B6452;padding:40px 0">📷 아직 없음 · 「📤 업로드」 또는 「✨ AI 새로」로 추가</div>';
      status.textContent = `총 0장`;
      return;
    }
    grid.innerHTML = d.items.map(it => {
      const src = it.source==='ai' ? '✨' : it.source==='master' ? '🎨' : '📤';
      const tags = [it.course, it.role].filter(Boolean).join('·');
      return `<div style="border:1.5px solid #F0D6CC;border-radius:8px;overflow:hidden;background:#fff;position:relative">
        <img src="${it.url}" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer" onclick="pickLibImage('${it.url}')">
        <div style="padding:6px 8px;font-size:11px;color:#5D4636;display:flex;justify-content:space-between;align-items:center;gap:4px">
          <span>${src} ${tags||'-'}</span>
          <button onclick="deleteLibImage(${it.id})" style="background:none;border:none;color:#c00;cursor:pointer;font-size:14px;padding:0">🗑</button>
        </div>
      </div>`;
    }).join('');
    status.textContent = `총 ${d.total}장 표시`;
  } catch(e){
    grid.innerHTML = `<div style="grid-column:1/-1;color:#c00">불러오기 실패: ${e.message}</div>`;
  }
}

function pickLibImage(url){
  // 6장 캐러셀 이미지로 지정 → localStorage 저장 + 재렌더
  // 지금 편집 중인 슬라이드에 반영 (없으면 모든 슬라이드에 후보 적용)
  showToast('🖼️ 라이브러리에서 선택 · 슬라이드 편집 모달에서 [원장님 자료] 시 자동 반영', '#E8B872');
}

async function deleteLibImage(id){
  if(!confirm('이 이미지 삭제?')) return;
  try {
    const r = await fetch(`${ENROLL_API}/library/${id}`, { method:'DELETE' });
    if(!r.ok) throw new Error('실패');
    loadLibrary();
    refreshLibCount();
  } catch(e){
    alert('삭제 실패: ' + e.message);
  }
}

function openAIGenModal(){
  const defaultPrompt = 'Luxury editorial portrait of Korean woman with hyperreal microblading eyebrows, warm rim light, brown hair, black tank top, cubic earring, dark background, close-up, cinematic';
  const body = `
    <div style="display:flex;flex-direction:column;gap:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <label style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#8B6452;font-weight:700">강의</span>${_tagSelect('a_course', COURSE_OPTS, '공통')}</label>
        <label style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#8B6452;font-weight:700">용도</span>${_tagSelect('a_role', ROLE_OPTS, '표지')}</label>
        <label style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#8B6452;font-weight:700">톤</span>${_tagSelect('a_tone', TONE_OPTS, '어두운배경')}</label>
      </div>
      <label style="display:flex;flex-direction:column;gap:4px">
        <span style="font-size:12px;color:#8B6452;font-weight:700">프롬프트 (영문 권장)</span>
        <textarea id="a_prompt" rows="5" style="padding:10px 14px;border:1.5px solid #F0D6CC;border-radius:8px;background:#fff;color:#3D2818;font-size:13px;font-family:inherit;resize:vertical">${defaultPrompt}</textarea>
      </label>
      <div style="font-size:12px;color:#8B6452;background:#FFF9F0;padding:10px 14px;border-radius:8px;border-left:3px solid #E8B872">
        모델: <b>Google Imagen 4 Fast</b> · 종횡비 3:4 (인스타 세로) · 약 6초/장 소요
      </div>
      <div id="a_status" style="font-size:13px;color:#8B6452;text-align:center;min-height:18px"></div>
      <div id="a_result" style="display:none;text-align:center">
        <img id="a_img" style="max-width:280px;border-radius:8px;border:1.5px solid #F0D6CC">
      </div>
    </div>`;
  const footer = `
    <button onclick="document.getElementById('aiGenModal').remove()" style="padding:10px 18px;background:#fff;border:1.5px solid #F0D6CC;color:#5D4636;border-radius:8px;font-weight:700;cursor:pointer">닫기</button>
    <button onclick="doAIGen()" id="a_gen_btn" style="padding:10px 24px;background:linear-gradient(135deg,#A875D9,#FF4D7E);color:#fff;border:none;border-radius:8px;font-weight:900;cursor:pointer">✨ 생성</button>`;
  _modalShell('aiGenModal', '✨ AI 이미지 새로 생성', body, footer);
}

async function doAIGen(){
  const status = document.getElementById('a_status');
  const btn = document.getElementById('a_gen_btn');
  const prompt = document.getElementById('a_prompt').value.trim();
  if(!prompt){ status.textContent = '❌ 프롬프트를 입력해주세요'; status.style.color='#c00'; return; }
  btn.disabled = true;
  btn.style.opacity = '0.5';
  status.textContent = '⏳ Imagen 4 생성 중 (약 6초)…';
  status.style.color = '#8B6452';
  const body = {
    prompt,
    course: document.getElementById('a_course').value,
    role:   document.getElementById('a_role').value,
    tone:   document.getElementById('a_tone').value,
  };
  try {
    const r = await fetch(`${ENROLL_API}/generate-ai`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if(!d.ok || !d.url){
      throw new Error(d.error || d.note || 'AI 응답 불량');
    }
    status.textContent = `✅ 저장 완료 · id=${d.id} · ${(d.file_size/1024).toFixed(0)}KB`;
    status.style.color = '#5C9C5C';
    document.getElementById('a_img').src = d.url;
    document.getElementById('a_result').style.display = 'block';
    refreshLibCount();
  } catch(e){
    status.textContent = '❌ 실패: ' + e.message;
    status.style.color = '#c00';
  } finally {
    btn.disabled = false;
    btn.style.opacity = '1';
  }
}

function showToast(msg, color='#3D2818'){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:${color};color:#fff;padding:12px 20px;border-radius:8px;z-index:1000;font-weight:700;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.2)`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
</script>
